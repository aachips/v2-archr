<!DOCTYPE html>
<!--
  App entry HTML. This file went missing when public/ was gutted, which is why
  the browser tab showed vue-cli's fallback title "Vue App" with the default
  favicon. Title and favicon are set HERE, not in Vue code. <%= BASE_URL %> is
  vue-cli's interpolation for the public base path — keep it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <title>ARCHR — Case Portal</title>
  </head>
  <body>
    <noscript>
      <strong>The ARCHR case portal needs JavaScript to run. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
