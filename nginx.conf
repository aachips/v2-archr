# Nginx configuration for ARCHR MVP
# Place at: /etc/nginx/sites-available/archr
# Then: ln -s /etc/nginx/sites-available/archr /etc/nginx/sites-enabled/archr
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name _;  # Replace with your domain or IP
    root /var/www/archr;
    index index.html index.php;

    # Error logging — verbose for debugging
    error_log /var/www/archr/logs/error.log debug;
    access_log /var/www/archr/logs/access.log;

    # Client max body size (for file uploads)
    client_max_body_size 50M;

    # =========================================================
    # 1. Static HTML pages at root
    # =========================================================
    location = / {
        try_files /index.html =404;
    }

    location = /landing.html {
        try_files /landing.html =404;
    }

    location = /privacy.html {
        try_files /privacy.html =404;
    }

    location = /dashboard.html {
        try_files /dashboard.html =404;
    }

    # Static assets with caching
    location ~* \.(svg|css|js|png|jpg|jpeg|gif|ico|woff2|woff|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================
    # 2. Vue SPA portal (/portal/)
    # =========================================================
    location /portal/ {
        alias /var/www/archr/portal/;
        try_files $uri $uri/ /portal/index.html;
    }

    # =========================================================
    # 3. Root-level PHP files (help.php, or future ones)
    # =========================================================
    location ~ ^/(.+)\.php$ {
        # Only allow .php files that actually exist in document root
        set $php_file /var/www/archr/$1.php;
        if (!-f $php_file) {
            return 404;
        }

        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $php_file;

        # Debug: show PHP errors in browser
        fastcgi_param PHP_VALUE "display_errors=1
display_startup_errors=1
error_reporting=E_ALL
log_errors=1
error_log=/var/www/archr/logs/php_errors.log";

        include fastcgi_params;
    }

    # =========================================================
    # 4. PHP backend (/app/)
    # =========================================================
    location /app/ {
        alias /var/www/archr/app/;
        index index.php;

        # Deny access to sensitive directories
        location ~ ^/app/(lib|config|partials|templates|backups|secure_config)/ {
            deny all;
        }

        # PHP handler for app/*.php
        location ~ ^/app/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;

            fastcgi_param PHP_VALUE "display_errors=1
display_startup_errors=1
error_reporting=E_ALL
log_errors=1
error_log=/var/www/archr/logs/php_errors.log";

            include fastcgi_params;
        }
    }

    # =========================================================
    # 5. Vue API bridge (/vue_api/)
    # =========================================================
    location /vue_api/ {
        alias /var/www/archr/app/vue_api/;
        index index.php;

        location ~ ^/vue_api/.+\.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;

            fastcgi_param PHP_VALUE "display_errors=1
display_startup_errors=1
error_reporting=E_ALL
log_errors=1
error_log=/var/www/archr/logs/php_errors.log";

            include fastcgi_params;
        }

        # CORS headers
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # =========================================================
    # 6. File uploads (internal only — served via PHP readfile)
    # =========================================================
    location /uploads/ {
        internal;
        alias /var/www/archr/uploads/;
    }

    # Deny access to raw markdown documentation
    location /documentation/ {
        deny all;
    }

    # Deny access to hidden files/directories
    location ~ /\. {
        deny all;
    }
}

