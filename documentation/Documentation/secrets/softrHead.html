<style>
    
        .iframe-container {
        position: relative;
        overflow: hidden;
        
        width: 100%;
        height: 1000px;
        padding-top: 56.25%; /* 16:9 Aspect Ratio (divide 9 by 16 = 0.5625) */
    }

    /* Then style the iframe to fit in the container div with full height and width */
    .responsive-iframe {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        width: 100%;
        height: 1000px;
    }
/* =========================================================
   ARCHR Session Deck + HUD (global CSS)
   Requires markup classes:
   - wrappers: .rc-hud or .rc-deck (both also use .rc-wrap)
   - links: .rc-panel (also used by your 2-tap JS)
   - overlay: .rc-overlay
   - pill base: .rc-pill
   - labels/icons: .rc-label, .rc-iconwrap, .rc-svg
   - phase internals: .rc-phase, .rc-phasecol, .rc-phasebadge,
                      .rc-phaselabel, .rc-phasenum, .rc-phasename,
                      .rc-jobcode
   ========================================================= */

/* ---------- Shared: panel + overlay ---------- */
.rc-panel{
  position:relative;
  display:block;
  text-decoration:none;
  color:inherit;
  border-radius:.75rem;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}

.rc-overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,.5);
  opacity:0;
  transition:opacity .15s ease;
  pointer-events:none;
  z-index:50;
  font-weight:900;
  color:#111;
}
.rc-backbutton{
  padding:.4rem .9rem;
  border-radius:999px;
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#00
  pointer-events:none;
  font-weight:900;
  color:#111;
}

.rc-overlay span{
  background:rgba(255,255,255,.75);
  padding:.4rem .9rem;
  border-radius:999px;
}

/* show overlay when hovered/focused/armed (your JS adds .armed) */
.rc-panel:hover .rc-overlay,
.rc-panel:focus .rc-overlay,
.rc-panel.armed .rc-overlay{
  opacity:1;
}

/* ---------- Shared: pill base ---------- */
.rc-pill{
  display:flex;
  align-items:center;
  gap:.75rem;
  border-radius:.6rem;
  padding:.5rem .75rem;
  box-sizing:border-box;
}

.rc-label{
  font-weight:600;
  line-height:1;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.rc-iconwrap{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  line-height:0;
}

.rc-svg{
  display:block;
  width:100%;
  height:100%;
}

/* ---------- Phase internals ---------- */
.rc-phasecol{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.35rem;
  flex:0 0 auto;
}

.rc-phasebadge{
  background:#000;
  color:#fff;
  border-radius:.6rem;
  padding:.2rem .6rem;
  text-align:center;
  line-height:1;
}

.rc-phaselabel{
  font-size:.75rem;
  font-weight:800;
}

.rc-phasenum{
  font-size:1.5rem;
  font-weight:800;
  margin-top:.15rem;
}

.rc-phasename{
  font-size:.85rem;
  font-weight:800;
  opacity:.95;
}

.rc-jobcode{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex:1;
  min-width:0;
}

.rc-jobcode span{
  font-size:1rem;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ---------- Phase pill layout lock (prevents “blow up”) ---------- */
.rc-phase{
  /* override rc-pill flex behavior */
  display:grid !important;
  grid-template-columns: 1fr auto 1fr; /* left | icon | right */
  align-items:center;
  column-gap:.75rem;
}

/* left stack */
.rc-phase .rc-phasecol{ justify-self:start; }

/* fixed icon box (cannot expand) */
.rc-phase .rc-iconwrap{
  width:var(--rc-phase-icon, 3.25rem) !important;
  height:var(--rc-phase-icon, 3.25rem) !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  justify-self:center;
  line-height:0 !important;
}

/* right jobcode */
.rc-phase .rc-jobcode{
  justify-self:end;
  min-width:0;
  display:flex;
  justify-content:flex-end;
}

/* ---------- HUD wrapper (stacked pills) ---------- */
.rc-hud{
  display:flex;
  flex-direction:column;
  gap:.5rem;
  align-items:flex-start;
  width:100%;
}

.rc-hud .rc-panel{
  width:16rem;            /* uniform width for all HUD pills */
  max-width:100%;
}

.rc-hud .rc-pill{
  width:100%;             /* pill fills the panel */
}

.rc-hud .rc-iconwrap{
  width:3rem;
  height:3rem;
  border-radius:.6rem;
}

/* smaller phase icon in HUD */
.rc-hud .rc-phase{ --rc-phase-icon: 2.5rem; }

/* ---------- Full deck wrapper (responsive 3 columns) ---------- */
.rc-deck{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:.75rem;
  align-items:start;
  width:100%;
}

.rc-deck .rc-panel{
  display:flex;
  flex-direction:column;
  gap:.35rem;
}

/* full deck phase icon size */
.rc-deck .rc-phase{ --rc-phase-icon: 3.25rem; }
</style>


<script>
/* ---- Logged-in user convenience ---- */
window.personID = null;
if (window.logged_in_user && window.logged_in_user.airtable_record_id) {
  window.personID = window.logged_in_user.airtable_record_id;
  console.log("logged_in_user:", window.logged_in_user);
}

/* ---- Helpers ---- */
function normalizeToString(v) {
  if (v == null) return "";
  if (Array.isArray(v)) return v.join("");              // <-- fixes Array(1)
  if (typeof v === "object" && "value" in v) return normalizeToString(v.value);
  return String(v);
}

function decodeIfEscaped(s) {
  s = normalizeToString(s);
  if (!(/[&]lt;|[&]gt;|[&]amp;/.test(s))) return s;
  var ta = document.createElement("textarea");
  ta.innerHTML = s;
  return ta.value;
}

function getLoggedInUserField(name) {
  var u = window.logged_in_user || {};
  // try direct + fields bag
  return (
    u[name] ||
    (u.fields && (u.fields[name] || u.fields[String(name)])) ||
    u[String(name)] ||
    ""
  );
}

function tryMount(elId, fieldName) {
  var el = document.getElementById(elId);
  if (!el || el.dataset.mounted === "1") return false;

  var raw = getLoggedInUserField(fieldName);
  var html = decodeIfEscaped(raw);

  el.innerHTML = html || "";
  el.dataset.mounted = "1";

  console.log("Mounted", fieldName, "→", elId, "len:", html.length);
  console.log(fieldName.value)

  return true;
}

/* ---- Mount FULL + HUD if mount divs exist ---- */
(function mountDecks() {
  var tries = 0;
  var t = setInterval(function () {
    tries++;

    // FULL deck (field name from your console: sessionDeckButtons)
    tryMount("sessionDeckFullMount", "sessionDeckButtons");
 //   tryMount("sessionDeckMount",     "sessionDeckButtons"); // fallback id

    // HUD deck (field name from your console: sessionDeckHUD)
    tryMount("sessionDeckHudMount",  "sessionDeckHUD");
    
    if (tries > 60) clearInterval(t);
  }, 150);
})();

/* ---- Mobile 2-tap confirm for any .rc-panel links ---- */
(function twoTapConfirm() {
  var mq = window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)");
  if (!mq || !mq.matches) return;

  document.addEventListener(
    "click",
    function (e) {
      var panel = e.target.closest(".rc-panel");
      var armed = document.querySelectorAll(".rc-panel.armed");

      if (!panel) {
        armed.forEach(function (el) { el.classList.remove("armed"); });
        return;
      }

      armed.forEach(function (el) { if (el !== panel) el.classList.remove("armed"); });

      if (!panel.classList.contains("armed")) {
        e.preventDefault(); // first tap: show overlay only
        panel.classList.add("armed");
        clearTimeout(panel._armT);
        panel._armT = setTimeout(function () { panel.classList.remove("armed"); }, 2500);
      } else {
        panel.classList.remove("armed"); // second tap: allow navigation
      }
    },
    true
  );
})();
</script>
